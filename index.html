<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta EI-MS</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --tx:#1d2330; --mut:#5b6474; --ln:#dde1e7;
    --acc:#0b5ea8; --bar:#0b5ea8; --base:#c0392b; --err:#a3261b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171c; --panel:#1c2027; --tx:#e6e9ee; --mut:#9aa3b2; --ln:#2c323c;
           --acc:#5aa9f0; --bar:#5aa9f0; --base:#ff7a6b; --err:#ff8a7f; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:960px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 20px;font-size:.9rem}
  form{display:flex;gap:8px;flex-wrap:wrap}
  input[type=text]{flex:1 1 260px;padding:10px 12px;border:1px solid var(--ln);border-radius:6px;background:var(--panel);color:var(--tx);font-size:1rem}
  select,button{padding:10px 14px;border-radius:6px;border:1px solid var(--ln);background:var(--panel);color:var(--tx);font-size:.95rem}
  button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;cursor:pointer}
  button:disabled{opacity:.55;cursor:wait}
  .panel{background:var(--panel);border:1px solid var(--ln);border-radius:8px;padding:16px;margin-top:18px}
  .estado{margin-top:14px;color:var(--mut);min-height:1.4em}
  .estado.err{color:var(--err)}
  dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
  dt{color:var(--mut)} dd{margin:0;word-break:break-all}
  .fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
  svg{width:100%;height:auto;display:block}
  .tabla-wrap{max-height:420px;overflow:auto;border:1px solid var(--ln);border-radius:6px;margin-top:12px}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--ln)}
  th{position:sticky;top:0;background:var(--panel);color:var(--mut);font-weight:600}
  tr.base td{color:var(--base);font-weight:700}
  .nota{font-size:.82rem;color:var(--mut);margin-top:14px}
  a{color:var(--acc)}
  .oculto{display:none}
</style>
</head>
<body>
<main>
  <h1>Espectros de masas EI: tabla m/z</h1>
  <p class="sub">Escriba el nombre del compuesto en inglés, su número CAS o su InChIKey. Las consultas se hacen de una en una.</p>

  <form id="f" autocomplete="off">
    <input id="q" type="text" placeholder="p. ej. benzoic acid · 65-85-0 · acetophenone" required maxlength="150">
    <select id="max" title="Número máximo de espectros">
      <option value="1">1 espectro</option>
      <option value="3" selected>3 espectros</option>
      <option value="5">5 espectros</option>
    </select>
    <button class="pri" id="btn" type="submit">Consultar</button>
  </form>
  <div id="estado" class="estado" role="status" aria-live="polite"></div>

  <section id="res" class="panel oculto">
    <dl id="info"></dl>

    <div class="fila">
      <label for="sel">Espectro:</label>
      <select id="sel"></select>
      <button type="button" id="bJson">Descargar JSON</button>
      <button type="button" id="bCsv">Descargar CSV</button>
    </div>
    <dl id="meta"></dl>

    <svg id="graf" viewBox="0 0 900 300" role="img" aria-label="Espectro de masas"></svg>

    <div class="tabla-wrap">
      <table>
        <thead><tr><th>m/z</th><th>Intensidad</th><th>Int. relativa (%)</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <p class="nota" id="cita"></p>
  </section>
</main>

<script>
(() => {
  const API = 'ms_api.php';            // ruta relativa al PHP
  const $ = id => document.getElementById(id);
  let datos = null, ocupado = false;

  const esc = s => String(s ?? '—').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function estado(msg, error = false) {
    $('estado').textContent = msg;
    $('estado').classList.toggle('err', error);
  }

  function dl(el, pares) {
    el.innerHTML = pares.filter(p => p[1] !== null && p[1] !== undefined && p[1] !== '')
      .map(([k, v, html]) => `<dt>${esc(k)}</dt><dd>${html ? v : esc(v)}</dd>`).join('');
  }

  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    if (ocupado) return;                         // una consulta a la vez
    const q = $('q').value.trim();
    if (!q) return;
    ocupado = true; $('btn').disabled = true;
    estado('Consultando…');
    $('res').classList.add('oculto');
    try {
      const url = `${API}?nombre=${encodeURIComponent(q)}&max=${$('max').value}`;
      const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
      const j = await r.json().catch(() => ({ error: 'Respuesta no válida del servidor.' }));
      if (!r.ok) throw new Error(j.error || `Error HTTP ${r.status}`);
      datos = j;
      mostrar();
      estado(`${j.devueltos} espectro(s) mostrado(s) de ${j.total_encontrados} encontrado(s).`);
    } catch (e) {
      estado(e.message, true);
    } finally {
      ocupado = false; $('btn').disabled = false;
    }
  });

  function mostrar() {
    const c = datos.compuesto || {};
    dl($('info'), [
      ['Compuesto', c.nombre],
      ['Nombre IUPAC', c.nombre_iupac],
      ['Fórmula', c.formula],
      ['Masa monoisotópica', c.masa_monoisotopica],
      ['InChIKey', c.inchikey],
      ['PubChem CID', c.pubchem_cid ? `<a href="https://pubchem.ncbi.nlm.nih.gov/compound/${encodeURIComponent(c.pubchem_cid)}" target="_blank" rel="noopener">${esc(c.pubchem_cid)}</a>` : null, true],
    ]);
    $('sel').innerHTML = datos.espectros.map((e, i) =>
      `<option value="${i}">${esc(e.accession)} · ${esc(e.tipo_instrumento)}</option>`).join('');
    $('cita').textContent = `Fuente: ${datos.fuente}. ${datos.cita}`;
    $('res').classList.remove('oculto');
    espectro(0);
  }

  $('sel').addEventListener('change', e => espectro(+e.target.value));

  function espectro(i) {
    const e = datos.espectros[i];
    dl($('meta'), [
      ['Registro', `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.accession)}</a>`, true],
      ['Título', e.titulo],
      ['Instrumento', [e.instrumento, e.tipo_instrumento].filter(Boolean).join(' · ')],
      ['Energía de ionización', e.energia_ionizacion],
      ['Pico base (m/z)', e.pico_base_mz],
      ['N.º de picos', e.num_picos],
      ['Licencia', e.licencia],
    ]);
    $('tb').innerHTML = e.picos.map(p =>
      `<tr class="${p.mz === e.pico_base_mz ? 'base' : ''}"><td>${p.mz}</td><td>${p.intensidad}</td><td>${p.intensidad_relativa.toFixed(1)}</td></tr>`
    ).join('');
    grafico(e);
  }

  // Gráfico de barras (sticks) en SVG
  function grafico(e) {
    const W = 900, H = 300, m = { l: 48, r: 14, t: 14, b: 36 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const mzs = e.picos.map(p => p.mz);
    const x0 = Math.max(0, Math.floor((Math.min(...mzs) - 5) / 10) * 10);
    const x1 = Math.ceil((Math.max(...mzs) + 5) / 10) * 10;
    const X = v => m.l + (v - x0) / (x1 - x0) * pw;
    const Y = v => m.t + ph - v / 100 * ph;
    const paso = (x1 - x0) > 300 ? 50 : (x1 - x0) > 120 ? 20 : 10;
    let s = `<g stroke="var(--ln)" stroke-width="1">`;
    for (let y = 0; y <= 100; y += 25) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(y)}" y2="${Y(y)}"/>`;
    s += `</g><g fill="var(--mut)" font-size="12">`;
    for (let y = 0; y <= 100; y += 25) s += `<text x="${m.l - 6}" y="${Y(y) + 4}" text-anchor="end">${y}</text>`;
    for (let v = x0; v <= x1; v += paso) s += `<text x="${X(v)}" y="${H - 14}" text-anchor="middle">${v}</text>`;
    s += `<text x="${m.l + pw / 2}" y="${H - 1}" text-anchor="middle">m/z</text></g>`;
    s += e.picos.map(p => {
      const col = p.mz === e.pico_base_mz ? 'var(--base)' : 'var(--bar)';
      return `<line x1="${X(p.mz)}" x2="${X(p.mz)}" y1="${Y(0)}" y2="${Y(p.intensidad_relativa)}" stroke="${col}" stroke-width="2"><title>m/z ${p.mz}: ${p.intensidad_relativa}%</title></line>`;
    }).join('');
    // Etiquetas de los picos > 20 %
    s += e.picos.filter(p => p.intensidad_relativa >= 20).map(p =>
      `<text x="${X(p.mz)}" y="${Y(p.intensidad_relativa) - 4}" text-anchor="middle" font-size="11" fill="var(--tx)">${Math.round(p.mz)}</text>`).join('');
    $('graf').innerHTML = s;
  }

  function descargar(nombre, contenido, tipo) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([contenido], { type: tipo }));
    a.download = nombre;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  const base = () => (datos.compuesto?.nombre || datos.consulta).replace(/[^\w.-]+/g, '_');

  $('bJson').addEventListener('click', () =>
    descargar(`${base()}_EI-MS.json`, JSON.stringify(datos, null, 2), 'application/json'));

  $('bCsv').addEventListener('click', () => {
    const e = datos.espectros[+$('sel').value];
    const csv = ['mz,intensidad,intensidad_relativa', ...e.picos.map(p => `${p.mz},${p.intensidad},${p.intensidad_relativa}`)].join('\n');
    descargar(`${base()}_${e.accession}.csv`, csv, 'text/csv');
  });
})();
</script>
</body>
</html>
